apiVersion: apps/v1
kind: Deployment
metadata:
  name: refresh-health
  labels:
    app: refresh-health
spec:
  replicas: 3
  selector:
    matchLabels:
      app: refresh-health
  template:
    metadata:
      labels:
        app: refresh-health
    spec:
      containers:
      - name: refresh-health
        image: your-dockerhub-username/refresh-health:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: refresh-health-secrets
              key: database-url
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: refresh-health-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: refresh-health-secrets
              key: aws-secret-access-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
```

```yaml:k8s/base/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: refresh-health-service
  labels:
    app: refresh-health
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: refresh-health
```

```yaml:k8s/base/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: refresh-health-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.yourdomain.com
    secretName: refresh-health-tls
  rules:
  - host: api.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: refresh-health-service
            port:
              number: 80
```

## 5. Environment-Specific Configurations

```yaml:k8s/overlays/staging/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging
bases:
- ../../base

patches:
- path: namespace-patch.yaml
- path: replica-patch.yaml

images:
- name: your-dockerhub-username/refresh-health
  newTag: latest

configMapGenerator:
- name: refresh-health-config
  literals:
  - ENVIRONMENT=staging
  - LOG_LEVEL=DEBUG
```

```yaml:k8s/overlays/production/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production
bases:
- ../../base

patches:
- path: namespace-patch.yaml
- path: replica-patch.yaml

images:
- name: your-dockerhub-username/refresh-health
  newTag: latest

configMapGenerator:
- name: refresh-health-config
  literals:
  - ENVIRONMENT=production
  - LOG_LEVEL=INFO
```

## 6. Testing Configuration

```ini:pytest.ini
[tool:pytest]
testpaths = app
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
```

## 7. Pre-commit Hooks

```yaml:.pre-commit-config.yaml
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-merge-conflict

-   repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
    -   id: black
        language_version: python3.11

-   repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
    -   id: flake8
        additional_dependencies: [flake8-docstrings]

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
    hooks:
    -   id: mypy
        additional_dependencies: [types-all]
```

## 8. Health Check Endpoint

You'll need to add a health check endpoint to your FastAPI app. Add this to your `app/main.py`:

```python:app/main.py
from fastapi import FastAPI
from app.core.middleware import register_middleware
from app.core.exception_handlers import register_exception_handlers
from app.core.routers import register_routers

app = FastAPI(
    title="Your API",
    version="1.0.0",
    description="API for patient management and authorization",
    responses={
        400: {"description": "Bad Request"},
        401: {"description": "Unauthorized"},
        403: {"description": "Forbidden"},
        404: {"description": "Not Found"},
        500: {"description": "Internal Server Error"},
    }
)

@app.get("/health")
async def health_check():
    return {"status": "healthy", "timestamp": datetime.utcnow()}

register_middleware(app)
register_exception_handlers(app)
register_routers(app)
```

