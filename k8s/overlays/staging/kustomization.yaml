apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging
bases:
- ../../base

patches:
- path: namespace-patch.yaml
- path: replica-patch.yaml

images:
- name: your-dockerhub-username/refresh-health
  newTag: latest

configMapGenerator:
- name: refresh-health-config
  literals:
  - ENVIRONMENT=staging
  - LOG_LEVEL=DEBUG
