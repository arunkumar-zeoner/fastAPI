version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql://user:password@db:3306/refresh_health
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    depends_on:
      - db
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    networks:
      - refresh-health-network

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=refresh_health
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - refresh-health-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - refresh-health-network

volumes:
  mysql_data:

networks:
  refresh-health-network:
    driver: bridge

