name: FastAPI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: fastapi-app

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov requests

    - name: Run pytest tests
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        AWS_REGION: us-east-1
        COGNITO_USER_POOL_ID: dummy
        COGNITO_CLIENT_ID: dummy
      run: |
        pytest tests/ -v --cov=app --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t $IMAGE_NAME:${{ github.sha }} .

    - name: Run container
      run: |
        docker run -d -p 8000:8000 --name test-container $IMAGE_NAME:${{ github.sha }}
        sleep 15

    - name: Test /authorize endpoint
      run: |
        curl -X POST http://localhost:8000/authorize \
          -H "Content-Type: application/json" \
          -d '{"request":{"userAttributes":{"custom:token":"test","site":"dev"}}}' \
          --fail --silent --show-error
        echo "✅ /authorize endpoint passed"

    - name: Test /patient-details endpoint
      run: |
        curl -X POST http://localhost:8000/patient-details \
          -H "Content-Type: application/json" \
          -H "Authorization: test-token" \
          -d '{"site":"dev","page":1,"page_size":5,"email":"prakash@zeoner.com"}' \
          --fail --silent --show-error
        echo "✅ /patient-details endpoint passed"

    - name: Deploy to production
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
      run: |
        docker pull samsudheen/fastapi-app:latest
        docker stop fastapi-app || true
        docker rm fastapi-app || true
        docker run -d --name fastapi-app -p 8000:8000 samsudheen/fastapi-app:latest